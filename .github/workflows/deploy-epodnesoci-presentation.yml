name: Deploy isolated e-PODNESOCI presentation

on:
  push:
    branches: [main]
    paths:
      - "presentation-e-podnesoci/**"
      - ".github/workflows/deploy-epodnesoci-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: presentation-e-podnesoci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy standalone presentation Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/epodnesoci-demo-deploy.log
          url="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/epodnesoci-demo-deploy.log | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::Wrangler did not report a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify the published presentation page
        shell: bash
        env:
          DEMO_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused "$DEMO_URL/" -o /tmp/epodnesoci-demo.html
          grep -q "ДЕМО ЗА ПРЕЗЕНТАЦИЈА" /tmp/epodnesoci-demo.html
