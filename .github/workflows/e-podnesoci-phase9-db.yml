name: e-PODNESOCI phase 9 PostgreSQL mutations
on:
  push:
    branches: [feature/e-podnesoci]
    paths:
      - 'phase9-workflow/**'
      - 'database/migrations/**'
      - '.github/workflows/e-podnesoci-phase9-db.yml'
  pull_request:
    paths:
      - 'phase9-workflow/**'
      - 'database/migrations/**'
      - '.github/workflows/e-podnesoci-phase9-db.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zdnp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d zdnp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zdnp_test
      APP_DATABASE_URL: postgresql://zdnp_app:ci_only_password@127.0.0.1:5432/zdnp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Base schema and RLS
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test -f database/migrations/001_initial.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test -f database/migrations/002_tenant_rls.sql
      - name: Restricted role and trusted functions
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test <<'SQL'
          CREATE ROLE zdnp_app LOGIN PASSWORD 'ci_only_password' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO zdnp_app;
          GRANT SELECT ON institutions,staff_users,cases,case_events,case_documents TO zdnp_app;
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test -f database/migrations/003_staff_lookup.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test -f database/migrations/004_case_transitions.sql
      - name: Install dependencies and run tests
        working-directory: phase9-workflow
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
