name: e-PODNESOCI Android and Windows

on:
  push:
    paths:
      - "apps/e-podnesoci/**"
      - ".github/workflows/e-podnesoci-app.yml"
  pull_request:
    paths:
      - "apps/e-podnesoci/**"
      - ".github/workflows/e-podnesoci-app.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/e-podnesoci
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --project-name zdnp_e_podnesoci --platforms=android .
      - run: flutter pub get
      - run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release --dart-define=ZDNP_API_BASE_URL=https://www.zdnp.org
      - uses: actions/upload-artifact@v4
        with:
          name: zdnp-e-podnesoci-android
          path: apps/e-podnesoci/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/e-podnesoci
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform files
        run: flutter create --project-name zdnp_e_podnesoci --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze
      - name: Build Windows release
        run: flutter build windows --release --dart-define=ZDNP_API_BASE_URL=https://www.zdnp.org
      - uses: actions/upload-artifact@v4
        with:
          name: zdnp-e-podnesoci-windows
          path: apps/e-podnesoci/build/windows/x64/runner/Release/**
          if-no-files-found: error
