name: e-PODNESOCI phase 6 database integration
on:
  push:
    branches: [feature/e-podnesoci]
    paths:
      - 'phase6-backend/**'
      - 'database/migrations/**'
      - '.github/workflows/e-podnesoci-phase6.yml'
  pull_request:
    paths:
      - 'phase6-backend/**'
      - 'database/migrations/**'
      - '.github/workflows/e-podnesoci-phase6.yml'
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zdnp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d zdnp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zdnp_test
      APP_DATABASE_URL: postgresql://zdnp_app:demo_app_password@127.0.0.1:5432/zdnp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migrations as database owner
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test -f database/migrations/001_initial.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test -f database/migrations/002_tenant_rls.sql
      - name: Create restricted application role
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zdnp_test <<'SQL'
          CREATE ROLE zdnp_app LOGIN PASSWORD 'demo_app_password' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO zdnp_app;
          GRANT SELECT ON institutions,staff_users,cases,case_events,case_documents TO zdnp_app;
          SQL
      - name: Install dependencies
        working-directory: phase6-backend
        run: npm install --no-audit --no-fund
      - name: Syntax and unit tests
        working-directory: phase6-backend
        run: |
          npm run check
          npm test
