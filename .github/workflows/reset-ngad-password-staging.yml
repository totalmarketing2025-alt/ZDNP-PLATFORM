name: Reset NGAD password (staging)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET-NGAD-STAGING to reset the staging NGAD account"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reset-ngad-password-staging
  cancel-in-progress: false

jobs:
  reset:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'RESET-NGAD-STAGING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reset NGAD password in staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NGAD_INITIAL_PASSWORD: ${{ secrets.NGAD_INITIAL_PASSWORD }}
          D1_DATABASE_ID: 73e44e6f-fba1-4b17-b223-9d9c265ddcd1
        run: |
          node --input-type=module <<'NODE'
          import { pbkdf2Sync, randomBytes } from 'node:crypto';

          const password = process.env.NGAD_INITIAL_PASSWORD;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const databaseId = process.env.D1_DATABASE_ID;
          if (!password) {
            console.error('Missing GitHub secret: NGAD_INITIAL_PASSWORD.');
            process.exit(1);
          }
          if (password.length < 12 || password.length > 256) {
            console.error('NGAD_INITIAL_PASSWORD must be between 12 and 256 characters.');
            process.exit(1);
          }
          if (!token) {
            console.error('Missing GitHub secret: CLOUDFLARE_API_TOKEN.');
            process.exit(1);
          }
          if (!accountId) {
            console.error('Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID.');
            process.exit(1);
          }
          if (!databaseId) {
            console.error('D1 database ID is not configured.');
            process.exit(1);
          }

          const salt = randomBytes(32).toString('hex');
          const digest = pbkdf2Sync(password, salt, 310000, 32, 'sha256').toString('hex');
          const passwordHash = `pbkdf2-sha256:310000:${salt}:${digest}`;
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${databaseId}/query`;

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${token}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              sql: "UPDATE users SET password_hash = ?, must_change_password = 1, failed_attempts = 0, locked_until = NULL WHERE id = ? AND username = 'NGAD' AND enabled = 1 RETURNING id, username",
              params: [passwordHash, '081f54da-3135-4d44-aa5f-075d8dc9052d'],
            }),
          });

          let result;
          try {
            result = await response.json();
          } catch {
            console.error(`Cloudflare D1 request failed (HTTP ${response.status}).`);
            process.exit(1);
          }
          if (!response.ok || result.success !== true) {
            console.error(`Cloudflare D1 update failed (HTTP ${response.status}).`);
            process.exit(1);
          }
          const row = result.result?.[0]?.results?.[0];
          if (!row || row.username !== 'NGAD') {
            console.error('The expected enabled NGAD account was not found in staging D1.');
            process.exit(1);
          }
          console.log('NGAD staging password reset. It must be changed after the next successful sign-in.');
          NODE
