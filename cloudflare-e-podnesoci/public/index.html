<!doctype html><html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZDNP · e-ПОДНЕСОЦИ</title><style>
:root{font-family:system-ui,sans-serif;color:#e9eef8;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;background:#16243b;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:32px auto;padding:0 18px}.card{background:#18273e;border:1px solid #304461;border-radius:14px;padding:22px;margin:18px 0}input,select,button{font:inherit;border-radius:7px;padding:10px;margin:6px 4px 6px 0}input,select{background:#0e1b2c;color:#fff;border:1px solid #567}button{background:#39b5a1;border:0;color:#071b1c;cursor:pointer}button.danger{background:#ec7f87}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #35455e}small{color:#a9b9cb}.row{display:flex;flex-wrap:wrap;gap:10px}.metric{flex:1;min-width:150px;background:#0e1b2c;border-radius:8px;padding:15px}#message{min-height:28px;color:#ffcf78}section[hidden]{display:none}a{color:#8dd} @media(max-width:650px){table{font-size:12px}td button{padding:6px}}</style></head><body><header><strong>ZDNP e-ПОДНЕСОЦИ</strong><span id="who"></span></header><main><p><strong>Тест систем.</strong> Не внесувајте вистински службени или затворски податоци. Пристапот е ограничен на овластени тест-корисници.</p><div id="message" role="status"></div>
<section id="login" class="card"><h1>Најава</h1><form id="loginForm"><input name="username" placeholder="Корисничко име" autocomplete="username" required><input name="password" type="password" placeholder="Лозинка" autocomplete="current-password" required><button>Најави се</button></form></section>
<section id="panel" hidden><div class="row"><h1>Администрација</h1><button id="logout">Одјави се</button></div>
<div class="card"><h2>Аналитика на активности</h2><div id="metrics" class="row"></div><h3>Последни активности</h3><table><thead><tr><th>Време</th><th>Корисник</th><th>Акција</th></tr></thead><tbody id="activity"></tbody></table></div>
<div class="card"><h2>Нов корисник</h2><form id="addForm"><input name="username" placeholder="Корисничко име" required minlength="3"><input name="displayName" placeholder="Име и презиме" required><select name="institutionId" id="institutionId"><option value="IDR">КПУ Идризово</option><option value="PRI">КПУ Прилеп</option><option value="STI">КПУ Штип</option></select><select name="role"><option value="educator">Воспитувач</option><option value="director">Директор</option><option value="service_head">Раководител</option><option value="archivist">Архивар</option><option value="institution_admin">Администратор</option></select><input name="password" type="password" minlength="12" placeholder="Привремена лозинка (12+)" required><button>Додади корисник</button></form></div>
<div class="card"><h2>Корисници</h2><table><thead><tr><th>Корисник</th><th>Позиција</th><th>Статус</th><th>Управување</th></tr></thead><tbody id="users"></tbody></table></div>
</section></main><script>
const $=id=>document.getElementById(id);
async function api(path,method='GET',data){const r=await fetch(path,{method,credentials:'same-origin',headers:{'content-type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Грешка');return j}
function msg(s){$('message').textContent=s}
function cell(text){const td=document.createElement('td');td.textContent=String(text??'');return td}
async function refresh(){
 const me=await api('/api/me');if(me.mustChangePassword){const oldPassword=prompt('Стара лозинка');const newPassword=prompt('Нова лозинка (12+ знаци)');if(oldPassword&&newPassword){await api('/api/change-password','POST',{oldPassword,newPassword});msg('Лозинката е сменета. Најавете се повторно.')}return;}$('login').hidden=true;$('panel').hidden=false;document.getElementById('institutionId').hidden=!me.centralAdmin;if(location.pathname!=='/dashboard')history.replaceState(null,'','/dashboard');$('who').textContent=me.username+' · '+me.role;
 const [{users},{total,byAction,recent}]=await Promise.all([api('/api/users'),api('/api/analytics')]);
 $('metrics').replaceChildren();const m=document.createElement('div');m.className='metric';m.textContent='Вкупно активности: '+total;$('metrics').append(m);
 const names=new Map(users.map(u=>[u.id,u.username]));$('activity').replaceChildren();
 recent.slice(-20).reverse().forEach(e=>{const tr=document.createElement('tr');tr.append(cell(e.at),cell(names.get(e.actorId)||'—'),cell(e.action));$('activity').append(tr)});
 $('users').replaceChildren();users.forEach(u=>{const tr=document.createElement('tr');tr.append(cell(u.username),cell(u.role),cell(u.enabled?'Активен':'Деактивиран'));const td=document.createElement('td');if(u.id!==me.id){for(const [label,action] of [['Ресетирај лозинка','reset-password'],['Деактивирај','disable'],['Избриши','delete']]){const b=document.createElement('button');b.textContent=label;if(action!=='reset-password')b.className='danger';b.onclick=async()=>{let data;if(action==='reset-password'){const password=prompt('Нова лозинка (најмалку 12 знаци):');if(password===null)return;data={password}}else if(!confirm('Потврди: '+label+' '+u.username))return;try{await api('/api/users/'+u.id+'/'+action,'POST',data);msg('Промената е зачувана');await refresh()}catch(e){msg(e.message)}};td.append(b)}}tr.append(td);$('users').append(tr)});
}
$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/login','POST',Object.fromEntries(f));e.target.reset();await refresh();msg('Успешна најава')}catch(err){msg(err.message)}};
$('addForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/users','POST',Object.fromEntries(new FormData(e.target)));e.target.reset();await refresh();msg('Корисникот е додаден')}catch(err){msg(err.message)}};
$('logout').onclick=async()=>{await api('/api/logout','POST');location.assign('/najava')};
refresh().catch(()=>{$('login').hidden=false;$('panel').hidden=true;if(location.pathname!=='/najava')history.replaceState(null,'','/najava')});
</script></body></html>
