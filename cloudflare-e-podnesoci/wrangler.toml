name = "zdnp-e-podnesoci-staging"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "zdnp-e-podnesoci-staging"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "staging"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
